version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=database
      - DB_DATABASE=erp
      - DB_USERNAME=erp
      - DB_PASSWORD=secret
    depends_on:
      - database
    volumes:
      - .:/var/www/html
    networks:
      - erp-network

  database:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=erp
      - MYSQL_USER=erp
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - erp-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - erp-network

volumes:
  db_data:

networks:
  erp-network:
    driver: bridge